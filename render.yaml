# Infrastructure for Expert Inbox Queue, as code.
#
# Render reads this file from the repo root ("New +" -> Blueprint). Changing
# infrastructure means editing this file and pushing, not clicking around the
# dashboard. The apply walkthrough is docs/render-deploy.md.

# Secrets are entered once, in this group, when the blueprint is applied.
# Both services read from it. Values live in Render, never in this file.
envVarGroups:
  - name: expert-inbox-secrets
    envVars:
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

services:
  - type: web
    name: expert-inbox-queue
    runtime: python
    plan: starter
    region: ohio
    branch: main

    # Render's Python image ships Node, so one service builds both halves:
    # the API and the frontend it serves.
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend && npm ci && npm run build

    # Runs after the build, before traffic moves over. If a migration fails
    # the old version keeps serving.
    preDeployCommand: cd backend && alembic upgrade head

    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - fromGroup: expert-inbox-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: expert-inbox-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true # Render generates one and keeps it stable
      - key: COOKIE_SECURE
        value: "1" # Render terminates TLS, so the cookie can be Secure
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: MONITORED_MAILBOXES
        value: craigz@expertsvc.com,megank@expertsvc.com,joyce@expertsvc.com
      - key: FORWARD_MAILBOX
        value: "" # queue@ forwarding deferred — see docs/decisions.md
      # Empty until the stage-two Mail.ReadWrite grant (azure-setup.md Part
      # 4c) — the app is read-only in Exchange and must not attempt tagging.
      - key: OUTLOOK_CATEGORY
        value: ""
      - key: OUTLOOK_CATEGORY_HANDLED
        value: ""
      - key: CLASSIFY_MODEL
        value: claude-sonnet-5

  # The mail poller. Reads each monitored mailbox on a loop, classifies with
  # the Claude model, drafts replies. Runs as its own service so a wedged
  # poll can never take the portal down with it — and so it can be restarted
  # on its own.
  #
  # It shares the database with the web service but runs no migrations: the
  # web service's preDeployCommand owns the schema. Two services racing to
  # migrate the same database is a bad afternoon.
  - type: worker
    name: expert-inbox-poller
    runtime: python
    plan: starter
    region: ohio
    branch: main

    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app.worker

    envVars:
      - fromGroup: expert-inbox-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: expert-inbox-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: POLL_SECONDS
        value: "60"
      - key: MONITORED_MAILBOXES
        value: craigz@expertsvc.com,megank@expertsvc.com,joyce@expertsvc.com
      - key: FORWARD_MAILBOX
        value: ""
      - key: OUTLOOK_CATEGORY
        value: ""
      - key: OUTLOOK_CATEGORY_HANDLED
        value: ""
      - key: CLASSIFY_MODEL
        value: claude-sonnet-5
      - key: INGEST_MAX_AGE_DAYS
        value: "7"

databases:
  - name: expert-inbox-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"
